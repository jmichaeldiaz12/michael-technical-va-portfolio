<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img">
  <title>Business Workflow Automation - Workflow diagram</title>
  <desc>Workflow diagram: a web form submission adds a row to Google Sheets, then emails the team and sends the customer a confirmation, with an error path that alerts the owner and retries.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586377"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B59D9"/></marker>
  </defs>
  <rect width="1200" height="750" fill="#F5F6F8"/>
  <text x="40" y="48" font-size="24" fill="#15233F" font-weight="700" text-anchor="start">Business Workflow Automation</text>
  <text x="40" y="72" font-size="15" fill="#586377" font-weight="400" text-anchor="start">Workflow diagram</text>
  <text x="40" y="94" font-size="15" fill="#586377" font-weight="400" text-anchor="start">Built with a no-code automation platform</text>
  <text x="40" y="270" font-size="15" fill="#586377" font-weight="600" text-anchor="start">Trigger</text>
  <rect x="40" y="280" width="240" height="100" rx="10" fill="#F2B544" stroke="#F2B544" stroke-width="1.5"/>
  <text x="160" y="325.3" font-size="15" fill="#15233F" font-weight="600" text-anchor="middle">Customer submits</text>
  <text x="160" y="345.3" font-size="15" fill="#15233F" font-weight="600" text-anchor="middle">the web form</text>
  <text x="380" y="270" font-size="15" fill="#586377" font-weight="600" text-anchor="start">Action 1</text>
  <rect x="380" y="280" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#2B59D9" stroke-width="2"/>
  <text x="540" y="325.3" font-size="15" fill="#15233F" font-weight="400" text-anchor="middle">Add a row to Google Sheets</text>
  <text x="540" y="345.3" font-size="15" fill="#15233F" font-weight="400" text-anchor="middle">(time, name, email, request)</text>
  <text x="800" y="175" font-size="15" fill="#586377" font-weight="600" text-anchor="start">Action 2</text>
  <rect x="800" y="185" width="360" height="100" rx="10" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="1.5"/>
  <text x="980" y="230.3" font-size="15" fill="#15233F" font-weight="400" text-anchor="middle">Email the team in Gmail:</text>
  <text x="980" y="250.3" font-size="15" fill="#15233F" font-weight="400" text-anchor="middle">new request</text>
  <text x="800" y="365" font-size="15" fill="#586377" font-weight="600" text-anchor="start">Action 3</text>
  <rect x="800" y="375" width="360" height="100" rx="10" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="1.5"/>
  <text x="980" y="420.3" font-size="15" fill="#15233F" font-weight="400" text-anchor="middle">Send the customer a</text>
  <text x="980" y="440.3" font-size="15" fill="#15233F" font-weight="400" text-anchor="middle">confirmation email</text>
  <path d="M280 330H380" fill="none" stroke="#2B59D9" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M700 330H750V235H800" fill="none" stroke="#2B59D9" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M750 330V425H800" fill="none" stroke="#2B59D9" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="400" y="540" width="600" height="80" rx="10" fill="#FFFFFF" stroke="#586377" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="700" y="585.3" font-size="15" fill="#15233F" font-weight="400" text-anchor="middle">If a step fails: alert the owner and retry</text>
  <path d="M540 380V540" fill="none" stroke="#586377" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag)"/>
  <path d="M1080 475V580H1000" fill="none" stroke="#586377" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ag)"/>
  <path d="M1160 235H1180V580H1080" fill="none" stroke="#586377" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="552" y="475" font-size="15" fill="#586377" font-weight="400" text-anchor="start">on failure</text>
</svg>
